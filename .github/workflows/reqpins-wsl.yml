name: "reqpins wsl"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: reqpins-wsl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: "reqpins wsl py${{ matrix.python }}"
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up WSL (Ubuntu 24.04)
        uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-24.04
          set-as-default: "true"
          update: "false"
          additional-packages: curl ca-certificates

      - name: Install uv inside WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> /dev/null
          "$HOME/.local/bin/uv" --version

      - name: Check requirement pins inside WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cd "$(wslpath '${{ github.workspace }}')"
          uv run --python ${{ matrix.python }} --no-project python tests/studio/install/check_requirement_pins.py ${{ matrix.python }}
