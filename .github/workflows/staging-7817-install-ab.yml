name: "PR 7817 install A B"

on:
  push:
    branches: [pr-7817-xplat-ci]
  workflow_dispatch:

concurrency:
  group: install-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab:
    name: "${{ matrix.variant }} on ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        variant: [old, new]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Pick the ref for this variant
        id: ref
        run: |
          if [ "${{ matrix.variant }}" = "old" ]; then
            echo "sha=main" >> "$GITHUB_OUTPUT"
          else
            echo "sha=ffa1298b4009f645b079645013665a27ad2cad70" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: unslothai/unsloth
          ref: ${{ steps.ref.outputs.sha }}
          path: src

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install the llama.cpp prebuilt (CPU)
        env:
          UNSLOTH_LLAMA_CPP_PATH: ${{ runner.temp }}/llama
        run: |
          set -x
          python src/studio/install_llama_prebuilt.py --force-cpu             --install-dir "$UNSLOTH_LLAMA_CPP_PATH" 2>&1 | tail -25
          echo "--- marker ---"
          python - <<'EOF'
          import json, os, pathlib
          p = pathlib.Path(os.environ["UNSLOTH_LLAMA_CPP_PATH"]) / "UNSLOTH_PREBUILT_INFO.json"
          d = json.loads(p.read_text())
          print("release_tag:", d.get("release_tag"))
          print("ggml_tree  :", d.get("ggml_tree"))
          EOF

      - name: Resolve the whisper.cpp slim prebuilt
        id: resolve
        env:
          UNSLOTH_LLAMA_CPP_PATH: ${{ runner.temp }}/llama
        run: |
          set -o pipefail
          python src/studio/install_whisper_prebuilt.py --resolve-prebuilt             --output-format json 2>&1 | tee resolve.txt || true
          echo "--- verdict ---"
          if grep -qi "no compatible prebuilt\|does not pair\|install or update llama" resolve.txt; then
            echo "RESULT=NO_COMPATIBLE_PREBUILT"
            echo "result=fail" >> "$GITHUB_OUTPUT"
          else
            echo "RESULT=PAIRED"
            echo "result=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Full whisper.cpp install
        env:
          UNSLOTH_LLAMA_CPP_PATH: ${{ runner.temp }}/llama
        run: |
          python src/studio/install_whisper_prebuilt.py             --install-dir "${{ runner.temp }}/whisper" 2>&1 | tail -25

      - name: Summary
        if: always()
        run: |
          echo "## ${{ matrix.variant }} / ${{ matrix.os }}: ${{ steps.resolve.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,40p' resolve.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
