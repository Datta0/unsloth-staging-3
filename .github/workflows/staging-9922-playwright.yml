name: "staging-9922 playwright engines"
on:
  push:
    branches: ["pr-9922-xplat-ci"]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  engines:
    # The changed code percent-decodes an ID that comes straight from the URL
    # bar, and decodeURIComponent throws URIError on malformed input. Node
    # cannot answer whether Chromium, Firefox and WebKit agree on that, on
    # non-ASCII case folding, or on encodeURIComponent's escape set -- so the
    # resolver is executed inside each engine against a real Vite server.
    #
    # Chromium stands in for Edge, WebKit for Safari: same engines.
    name: "Hub resolver in ${{ matrix.engine }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend deps
        working-directory: studio/frontend
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Install Playwright and the engine
        run: |
          python -m pip install 'playwright>=1.45,<2'
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Run the resolver inside ${{ matrix.engine }}
        env:
          ENGINES: ${{ matrix.engine }}
        run: python tests/studio/playwright_hub_selection_engines.py studio/frontend
