name: "staging-8151 ubuntu-latest"
on:
  push:
    branches: ["pr-8151-xplat-ci"]
    paths:
      - 'studio/frontend/src/app/provider.tsx'
      - 'studio/frontend/src/components/tauri/closing-signal.ts'
      - 'studio/frontend/src/components/tauri/startup-screen.tsx'
      - 'studio/frontend/src/components/tauri/window-titlebar.tsx'
      - 'studio/frontend/src/hooks/use-tauri-backend.ts'
      - 'studio/frontend/tests/desktop-closing-overlay.test.ts'
      - 'studio/src-tauri/src/main.rs'
      - '.github/workflows/staging-8151-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
