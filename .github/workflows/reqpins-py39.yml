name: "reqpins py39 informational"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: reqpins-py39-informational-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: "reqpins py39 informational py${{ matrix.python }}"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check requirement pins
        run: uv run --python ${{ matrix.python }} --no-project python tests/studio/install/check_requirement_pins.py ${{ matrix.python }}
