name: "staging-6739 e2e install validation"
on:
  push:
    branches: ["pr-6739-e2e"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, userns: na }
          - { os: windows-latest, userns: na }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
          persist-credentials: false
      - name: Fetch main for the base arm
        run: git clone -q --depth 1 https://github.com/unslothai/unsloth main && git -C main log -1 --format=%h
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux sandbox setup
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          if [ "${{ matrix.userns }}" = "open" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          else
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 || true
          fi
          ls -la "$(command -v bwrap)"
          bwrap --ro-bind / / --unshare-all --die-with-parent true && echo "BWRAP_USABLE=yes" || echo "BWRAP_USABLE=no"
      - name: Plan the head picks
        run: |
          cat > plan.py <<'EOF'
          import sys, importlib.util
          from pathlib import Path
          sys.path.insert(0, "head/studio")
          spec = importlib.util.spec_from_file_location("ilp", "head/studio/install_llama_prebuilt.py")
          m = importlib.util.module_from_spec(spec); sys.modules["ilp"] = m; spec.loader.exec_module(m)
          host = m.detect_host()
          for purpose in (m._VALIDATION_PURPOSE_LDD, m._VALIDATION_PURPOSE_QUANTIZE, m._VALIDATION_PURPOSE_SERVER):
              plan = m.build_validation_sandbox_plan(["/x/bin", "--port", "8123"], binary_path=Path("/x/bin"), install_dir=Path("/x"), purpose=purpose, env={}, host=host)
              print("PLAN", purpose, plan.sandbox_kind, plan.action, plan.reason)
          EOF
          python plan.py 2>&1 | grep '^PLAN'
      - name: Install with staged validation (main, then head)
        env:
          UNSLOTH_LLAMA_STAGED_VALIDATION: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          for arm in main head; do
            start=$(date +%s)
            python -u "$arm/studio/install_llama_prebuilt.py" --install-dir "$RUNNER_TEMP/inst_$arm/llama.cpp" > "log_$arm.txt" 2>&1
            rc=$?
            grep -vE 'Downloading .*%' "log_$arm.txt" | tail -n 30
            skipped=$(grep -c "validation skipped" "log_$arm.txt")
            launched=$(grep -c "UNSLOTH_INSTALLER_CHILD started" "log_$arm.txt")
            fellback=$(grep -cE "falling back to source|prebuilt install failed" "log_$arm.txt")
            ok=$(grep -cE "validation (succeeded|completed)" "log_$arm.txt")
            echo "RESULT arm=$arm rc=$rc validated=$ok server_launched=$launched skipped=$skipped fallback=$fellback secs=$(( $(date +%s) - start ))" | tee -a results.txt
          done
          cat results.txt
      - name: Direct validation probe with negative control
        if: always()
        run: python -u head/tests/pr6739_validate_probe.py head "$RUNNER_TEMP/inst_main/llama.cpp" 2>&1 | tail -n 60
      - name: macOS Metal under the Seatbelt profile
        if: always() && runner.os == 'macOS'
        run: python -u head/tests/pr6739_macos_metal_probe.py head "$RUNNER_TEMP/inst_main/llama.cpp" 2>&1 | tail -n 40
      - name: Verdict
        run: |
          cat results.txt
          grep -q "arm=head rc=0 " results.txt
          grep "arm=head" results.txt | grep -q "skipped=0"
          grep "arm=head" results.txt | grep -q "fallback=0"
