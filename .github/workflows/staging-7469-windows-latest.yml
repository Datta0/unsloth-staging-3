name: "staging-7469 windows-latest"
on:
  push:
    branches: ["pr-7469-xplat-ci"]
    paths:
      - 'studio/**'
      - '.github/workflows/staging-7469-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11' 'torchvision<0.26' 'transformers>=4.51,<5.5' 'unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo'
      - run: python -m pip install 'bitsandbytes>=0.45' || echo "optional deps unavailable on windows-latest"
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest tests/studio/install/test_rocm_rdna_routing.py -q --tb=short || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
