name: "staging-7929 macos-14"
on:
  push:
    branches: ["pr-7929-xplat-ci"]
    paths:
      - 'studio/frontend/src/features/hub/download-manager/download-manager-state.ts'
      - 'studio/frontend/src/features/training/hooks/use-training-unload-guard.ts'
      - 'studio/frontend/src/hooks/use-tauri-update.ts'
      - 'studio/frontend/tests/download-transport-persistence.test.ts'
      - 'studio/frontend/tests/helpers/kit.ts'
      - 'studio/src-tauri/src/main.rs'
      - '.github/workflows/staging-7929-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
