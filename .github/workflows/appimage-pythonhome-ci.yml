name: AppImage PYTHONHOME repro

# Linux-only by construction: AppImage is a Linux format, and this failure mode
# comes from AppImageKit's stock AppRun exporting PYTHONHOME=$APPDIR/usr/ into
# every child. macOS .app bundles and Windows installers have no equivalent.
#
# Reported symptom (locally built AppImage, backend never starts):
#   [backend] [stderr] Fatal Python error: Failed to import encodings module
#   [backend] [stderr] Python runtime state: core initialized
#   [backend] [stderr] ModuleNotFoundError: No module named 'encodings'
#   Backend stdout stream ended with status: exit status: 1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanism-repro:
    name: Reproduce the crash from PYTHONHOME alone
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # No Unsloth code involved: a stock venv plus the one variable AppRun
      # sets. Establishes that the reported log needs no other ingredient.
      - name: A venv interpreter dies under an AppDir PYTHONHOME
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/repro"
          mkdir -p "$work/AppDir/usr"
          python3 -m venv "$work/venv"

          echo "--- baseline: clean environment ---"
          "$work/venv/bin/python" -c "import sys; print('ok', sys.prefix)"

          echo "--- with PYTHONHOME as AppImageKit AppRun sets it ---"
          set +e
          out="$(PYTHONHOME="$work/AppDir/usr/" "$work/venv/bin/python" -c "print('unreachable')" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::expected the interpreter to fail under PYTHONHOME"
            exit 1
          fi
          printf '%s\n' "$out" | grep -q 'Failed to import encodings module' \
            || { echo "::error::did not reproduce the reported fatal error"; exit 1; }
          echo "Reproduced the reported crash from PYTHONHOME alone."

  rust-scrub-behaviour:
    name: Scrub clears it (real venv, real spawn)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Linux native deps for Tauri / WebKit2GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      # The crate's build script needs the frontend dist to exist.
      - name: Frontend build
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
          test -f dist/index.html

      # appimage_python_env_tests builds a real venv, exports the AppRun
      # environment, and spawns through scrub_appimage_python_env itself, so a
      # scrub that is wired up but ineffective fails here.
      - name: Rust unit tests (studio/src-tauri)
        working-directory: studio/src-tauri
        run: cargo test --no-fail-fast

  appimage-packaging-guards:
    name: Thin AppRun exports no Python variables
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python3 -m pip install --upgrade pytest

      - name: Release AppImage packaging suite
        run: python3 -m pytest -q tests/security/test_release_desktop_appimage.py

      # The sanctioned packager writes its own AppRun. If it ever grows a
      # Python export, the scrub above is the only thing standing between a
      # user and a dead backend -- fail loudly instead.
      - name: The thin AppRun template sets no PYTHONHOME / PYTHONPATH
        run: |
          set -euo pipefail
          script=studio/src-tauri/linux/build-thin-appimage.sh
          if grep -Eq '(^|[[:space:]])(export[[:space:]]+)?PYTHON(HOME|PATH)=' "$script"; then
            echo "::error::$script now exports a Python variable into AppRun"
            exit 1
          fi
          echo "Thin AppRun exports no Python variables."

      # Tauri's own AppImage bundler installs AppImageKit's AppRun, which does.
      # The release path must keep it disabled.
      - name: Tauri AppImage bundling stays disabled
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          config = json.load(open("studio/src-tauri/tauri.conf.json"))
          targets = config.get("bundle", {}).get("targets", [])
          if any(str(t).lower() == "appimage" for t in targets):
              sys.exit("tauri.conf.json re-enabled Tauri AppImage bundling")
          print("Tauri AppImage bundling is disabled; targets =", targets)
          PY
