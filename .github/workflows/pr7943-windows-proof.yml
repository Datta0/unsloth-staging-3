name: PR7943 proof

# Definitive validation of PR #7943 (Windows PowerShell verbatim resource path).
# Three questions, answered on real runners rather than by reasoning:
#   1. Does Windows PowerShell 5.1 under RemoteSigned really reject a \\?\ script path?
#   2. Does the path Tauri hands install.rs actually carry the \\?\ prefix?
#   3. Does the PR's normalization compile + pass on Windows, and change nothing elsewhere?

on:
  push:
    branches: ['pr-7943-**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Q1 ── the authorization behaviour itself, isolated from Rust entirely ──
  authmanager-repro:
    name: PS 5.1 RemoteSigned vs verbatim path
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: A/B the exact command shape install.rs uses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ps51 = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          if (-not (Test-Path $ps51)) { throw "Windows PowerShell 5.1 not found at $ps51" }
          "PS 5.1 version: " + (& $ps51 -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')

          # Mirror the real install dir shape from the field report: spaces AND parentheses.
          $dir = Join-Path $env:LOCALAPPDATA 'Unsloth Studio (Desktop)'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $probe = Join-Path $dir 'probe.ps1'
          Set-Content -LiteralPath $probe -Value 'Write-Output "SCRIPT_RAN_OK"' -Encoding ASCII

          $ordinary = $probe
          $verbatim = "\\?\" + $probe

          function Invoke-Probe {
            param([string]$Label, [string]$ScriptPath, [string]$Policy)
            $args = @('-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy',$Policy,'-File',$ScriptPath)
            $out = & $ps51 @args 2>&1 | Out-String
            $code = $LASTEXITCODE
            $ran  = $out -match 'SCRIPT_RAN_OK'
            $auth = $out -match 'AuthorizationManager|UnauthorizedAccess'
            "----- $Label"
            "  policy=$Policy exit=$code ran=$ran authError=$auth"
            "  path=$ScriptPath"
            "  output: " + ($out.Trim() -replace "`r?`n", ' | ')
            [pscustomobject]@{ Label=$Label; Ran=$ran; Auth=$auth }
          }

          $results = @()
          "===== no mark-of-the-web, unsigned, local file ====="
          $results += Invoke-Probe 'ordinary + RemoteSigned' $ordinary 'RemoteSigned'
          $results += Invoke-Probe 'verbatim + RemoteSigned' $verbatim 'RemoteSigned'
          $results += Invoke-Probe 'ordinary + Bypass'       $ordinary 'Bypass'
          $results += Invoke-Probe 'verbatim + Bypass'       $verbatim 'Bypass'
          $results += Invoke-Probe 'ordinary + AllSigned'    $ordinary 'AllSigned'
          $results += Invoke-Probe 'verbatim + AllSigned'    $verbatim 'AllSigned'

          "===== streams present on the probe (field report showed only :`$DATA) ====="
          Get-Item -LiteralPath $probe -Stream * | Select-Object Stream, Length | Format-Table | Out-String

          "===== with an explicit Zone.Identifier (mark-of-the-web) ====="
          Set-Content -LiteralPath "$probe`:Zone.Identifier" -Value "[ZoneTransfer]`r`nZoneId=3" -Encoding ASCII
          $results += Invoke-Probe 'ordinary + RemoteSigned + MOTW' $ordinary 'RemoteSigned'
          $results += Invoke-Probe 'verbatim + RemoteSigned + MOTW' $verbatim 'RemoteSigned'
          Remove-Item -LiteralPath "$probe`:Zone.Identifier" -Force -ErrorAction SilentlyContinue

          "===== the real bundled install.ps1, invalid arg so it exits early ====="
          $real = Join-Path $dir 'install.ps1'
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'install.ps1') -Destination $real -Force
          foreach ($p in @($real, ("\\?\" + $real))) {
            $lbl = if ($p.StartsWith('\\?\')) { 'verbatim' } else { 'ordinary' }
            $out = & $ps51 -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File $p '--package' '###invalid###' 2>&1 | Out-String
            $auth = $out -match 'AuthorizationManager|UnauthorizedAccess'
            "----- real install.ps1 ($lbl): authError=$auth"
            "  output: " + ($out.Trim() -replace "`r?`n", ' | ') -replace '^(.{0,600}).*$', '$1'
          }

          "===== VERDICT ====="
          $vRS = $results | Where-Object { $_.Label -eq 'verbatim + RemoteSigned' }
          $oRS = $results | Where-Object { $_.Label -eq 'ordinary + RemoteSigned' }
          "verbatim+RemoteSigned  ran=$($vRS.Ran) authError=$($vRS.Auth)"
          "ordinary+RemoteSigned  ran=$($oRS.Ran) authError=$($oRS.Auth)"
          if ($oRS.Ran -and -not $vRS.Ran) {
            "CONFIRMED: the \\?\ spelling alone breaks RemoteSigned; PR #7943 addresses the real cause."
          } elseif ($oRS.Ran -and $vRS.Ran) {
            "NOT REPRODUCED on this runner: both spellings authorized. PR #7943 would be a no-op here."
          } else {
            "INCONCLUSIVE: the ordinary spelling did not run either; another factor is involved."
          }

  # ── Q2 ── does Tauri's resource path actually arrive verbatim? ──
  tauri-path-reachability:
    name: Tauri resource path prefix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Replicate tauri-utils starting_binary -> resource_dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe/src"
          cd "$RUNNER_TEMP/probe"
          cat > Cargo.toml <<'EOF'
          [package]
          name = "probe"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          tauri-utils = "2"
          EOF
          cat > src/main.rs <<'EOF'
          // tauri-utils 2.x: platform::current_exe() -> STARTING_BINARY
          //   -> starting_binary.rs: dangerous_path.canonicalize()
          //   -> platform::resource_dir() returns that exe's parent on Windows.
          // So whatever canonicalize() produces is what install.rs receives.
          fn main() {
              let raw = std::env::current_exe().unwrap();
              println!("current_exe()            = {:?}", raw);
              let canon = std::fs::canonicalize(&raw).unwrap();
              println!("canonicalize(current_exe)= {:?}", canon);
              let parent = canon.parent().unwrap().to_path_buf();
              println!("resource_dir equivalent  = {:?}", parent);
              let script = parent.join("install.ps1");
              println!("script path install.rs sees = {:?}", script);
              let disp = script.display().to_string();
              println!("VERBATIM_PREFIX_PRESENT  = {}", disp.starts_with(r"\\?\"));
              // and what tauri-utils itself reports
              match tauri_utils::platform::current_exe() {
                  Ok(p) => println!("tauri_utils::platform::current_exe() = {:?} verbatim={}",
                                    p, p.display().to_string().starts_with(r"\\?\")),
                  Err(e) => println!("tauri_utils current_exe error: {e}"),
              }
          }
          EOF
          cargo run --quiet

  # ── Q3 ── the PR's own test, on every OS, plus an exhaustive corpus ──
  rust-tests:
    name: cargo test studio/src-tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri -> target

      - name: Linux native deps for Tauri / WebKit2GTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Frontend build (tauri build script needs dist/)
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit && npm run build

      - name: Rust unit tests
        working-directory: studio/src-tauri
        run: cargo test --no-fail-fast

      - name: Show that the windows-only test actually ran (Windows only)
        if: runner.os == 'Windows'
        working-directory: studio/src-tauri
        run: cargo test powershell_script_path -- --nocapture --exact install::tests::powershell_script_path_normalizes_verbatim_filesystem_paths

  # ── Q3b ── exhaustive edge-case corpus against the real std::path on Windows ──
  exhaustive-corpus:
    name: Exhaustive path corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/corpus/src"
          cp .ci/pr7943_corpus.rs "$RUNNER_TEMP/corpus/src/main.rs"
          cd "$RUNNER_TEMP/corpus"
          cat > Cargo.toml <<'EOF'
          [package]
          name = "corpus"
          version = "0.1.0"
          edition = "2021"
          EOF
          cargo run --quiet --release
