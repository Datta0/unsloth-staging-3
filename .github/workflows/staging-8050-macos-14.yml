name: "staging-8050 macos-14"
on:
  push:
    branches: ["pr-8050-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/tests/test_gpu_init_crash_message.py'
      - 'studio/backend/tests/test_install_resolve_prebuilt.py'
      - 'studio/backend/tests/test_llama_cpp_update.py'
      - 'studio/backend/tests/test_metal_paravirtual_guard.py'
      - 'studio/backend/utils/llama_cpp_update.py'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - 'studio/frontend/src/features/chat/hooks/use-chat-model-runtime.ts'
      - 'studio/frontend/src/features/chat/lib/gpu-placement.ts'
      - 'studio/frontend/src/features/chat/stores/chat-runtime-store.ts'
      - 'studio/frontend/src/features/chat/types/api.ts'
      - 'studio/frontend/tests/auto-load-cpu-fallback-toast.test.ts'
      - 'studio/frontend/tests/gpu-placement.test.ts'
      - 'studio/install_llama_prebuilt.py'
      - '.github/workflows/staging-8050-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_gpu_init_crash_message.py studio/backend/tests/test_install_resolve_prebuilt.py studio/backend/tests/test_llama_cpp_update.py studio/backend/tests/test_metal_paravirtual_guard.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
