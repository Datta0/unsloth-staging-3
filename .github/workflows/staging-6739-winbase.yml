name: "staging-6739 windows base vs head tests"
on:
  push:
    branches: ["pr-6739-e2e"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone base (main) and head (PR)
        run: |
          git clone -q --depth 1 https://github.com/unslothai/unsloth base
          git clone -q --depth 50 --branch pr/6698-install-validation-sandbox https://github.com/rodboev/unsloth head
          git -C base log -1 --format=%h; git -C head log -1 --format=%h
      - run: python -m pip install -q -r head/studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - name: Run the installer test file in each tree
        run: |
          set +e
          for arm in base head; do
            (cd $arm && PYTHONPATH=studio/backend python -m pytest tests/studio/install/test_install_llama_prebuilt_logic.py -q -p no:cacheprovider -rf > ../out_$arm.txt 2>&1)
            grep -aE "^(FAILED|ERROR) " out_$arm.txt | sed 's/ - .*//' | sort > failed_$arm.txt
            echo "SUMMARY $arm $(tail -n 1 out_$arm.txt)"
          done
          echo "ONLY_HEAD:"; comm -13 failed_base.txt failed_head.txt
          echo "ONLY_BASE:"; comm -23 failed_base.txt failed_head.txt
          echo "BOTH: $(comm -12 failed_base.txt failed_head.txt | wc -l)"
