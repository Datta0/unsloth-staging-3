name: "Ask bar on Mac (MLX end to end)"

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ['ask-bar-e2e-*']

permissions:
  contents: read

concurrency:
  group: ask-bar-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ask-bar:
    name: "Ask bar ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      MODEL: mlx-community/SmolLM-135M-Instruct-4bit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      - name: Install Unsloth (--local, with the MLX stack)
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs
          set -o pipefail
          bash install.sh --local 2>&1 | tee logs/install.log | tail -40

      - name: Check MLX is importable in the Studio venv
        run: |
          "$HOME/.unsloth/studio/unsloth_studio/bin/python" -c "import mlx.core as mx, mlx_lm; print('mlx', mx.__version__, mx.default_device())"

      - name: Cache the MLX model and remember it as the last model loaded in Chat
        run: |
          PY="$HOME/.unsloth/studio/unsloth_studio/bin/python"
          "$PY" -c "from huggingface_hub import snapshot_download; print(snapshot_download('$MODEL'))"
          cd studio/backend
          "$PY" -c "
          from storage.studio_db import upsert_app_settings, get_app_setting
          upsert_app_settings({'last_local_model_load': {'id': '$MODEL', 'kind': 'model', 'gguf_variant': None}})
          print(get_app_setting('last_local_model_load'))
          "

      - name: Build the desktop app (debug, no bundle)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          npm ci --prefix studio --no-fund --no-audit
          (cd studio/frontend && npm ci --no-fund --no-audit && npm run build && test -f dist/ask.html)
          npx --prefix studio tauri build --debug --no-bundle
          ls -la studio/src-tauri/target/debug/unsloth-studio

      - name: Rust unit tests (Ask bar)
        working-directory: studio/src-tauri
        run: cargo test ask_bar

      - name: Build the input driver
        run: swiftc -O -o "$RUNNER_TEMP/ask_driver" .github/ask-bar-ci/ask_driver.swift

      - name: Drive the Ask bar
        env:
          BIN: ${{ github.workspace }}/studio/src-tauri/target/debug/unsloth-studio
          DRIVER: ${{ runner.temp }}/ask_driver
          OUT: ${{ github.workspace }}/ask-bar-evidence
        run: bash .github/ask-bar-ci/run_e2e.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ask-bar-${{ matrix.os }}
          path: |
            ask-bar-evidence
            logs/install.log
          if-no-files-found: warn
