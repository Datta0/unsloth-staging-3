name: "staging-9922 ubuntu-latest"
on:
  push:
    branches: ["pr-9922-xplat-ci"]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: studio/frontend
jobs:
  frontend:
    name: "Hub selection suite (ubuntu-latest)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # --ignore-scripts matches the upstream Windows job; the runner's npm
      # predates --strict-allow-scripts.
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Focused Hub selection tests
        run: |
          node --experimental-strip-types --test \
            tests/hub-selection-resolution.test.ts \
            tests/hub-selection-compat.test.ts \
            tests/download-inventory-kind.test.ts \
            tests/download-scoped-kind-upgrade.test.ts \
            tests/download-scoped-delete-hint.test.ts
      # The whole suite, so a Hub change that breaks something else is caught
      # on this OS too. No '|| true': this is a gate.
      - name: Full frontend suite
        run: npm test
