name: "staging-8033 macos-14"
on:
  push:
    branches: ["pr-8033-xplat-ci"]
    paths:
      - 'studio/frontend/src/app/provider.tsx'
      - 'studio/frontend/src/features/deep-links/deep-link-handler.tsx'
      - 'studio/frontend/src/features/settings/api/launch-at-login.ts'
      - 'studio/frontend/src/features/settings/settings-search.ts'
      - 'studio/frontend/src/features/settings/tabs/general-tab.tsx'
      - 'studio/frontend/src/i18n/locales/ar.ts'
      - 'studio/frontend/src/i18n/locales/de.ts'
      - 'studio/frontend/src/i18n/locales/en.ts'
      - 'studio/frontend/src/i18n/locales/es.ts'
      - 'studio/frontend/src/i18n/locales/fr.ts'
      - 'studio/frontend/src/i18n/locales/hi.ts'
      - 'studio/frontend/src/i18n/locales/it.ts'
      - 'studio/frontend/src/i18n/locales/ja.ts'
      - 'studio/frontend/src/i18n/locales/ko.ts'
      - 'studio/frontend/src/i18n/locales/pt-br.ts'
      - 'studio/frontend/src/i18n/locales/ru.ts'
      - 'studio/frontend/src/i18n/locales/zh-CN.ts'
      - 'studio/frontend/tests/settings-search.test.ts'
      - 'studio/src-tauri/Cargo.lock'
      - 'studio/src-tauri/Cargo.toml'
      - '.github/workflows/staging-8033-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
