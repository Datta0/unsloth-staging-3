name: "staging-7873 ubuntu-latest"
on:
  push:
    branches: ["pr-7873-xplat-ci"]
    paths:
      - 'studio/backend/hub/schemas/inventory.py'
      - 'studio/backend/hub/services/models/gguf_variants.py'
      - 'studio/backend/hub/tests/test_model_services.py'
      - 'studio/backend/hub/utils/gguf.py'
      - 'studio/backend/hub/utils/inventory_scan.py'
      - 'studio/backend/models/models.py'
      - 'studio/backend/routes/models.py'
      - 'studio/backend/tests/test_cached_gguf_routes.py'
      - 'studio/backend/tests/test_gguf_variants_local_resolution.py'
      - 'studio/backend/tests/test_remote_access_settings.py'
      - 'studio/backend/tests/test_secure_tunnel_gate.py'
      - 'studio/backend/utils/models/model_config.py'
      - '.github/workflows/staging-7873-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/hub/tests/test_model_services.py studio/backend/tests/test_cached_gguf_routes.py studio/backend/tests/test_gguf_variants_local_resolution.py studio/backend/tests/test_remote_access_settings.py studio/backend/tests/test_secure_tunnel_gate.py tests/studio/test_model_picker_contracts.py unsloth_cli/tests/test_start.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
