name: "staging-7698 windows-latest"
on:
  push:
    branches: ["pr-7698-xplat-ci"]
    paths:
      - 'unsloth/**'
      - 'tests/**'
      - '.github/workflows/staging-7698-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install 'torch>=2.4,<2.11' 'torchvision<0.26' 'transformers>=4.51,<5.5' 'numpy<3' cloudpickle 'unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo'
      - run: python -m pip install 'bitsandbytes>=0.45' || echo "optional deps unavailable on windows-latest"
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest tests/test_video_path_validation.py tests/test_pr7698_platform_probe.py -q -s --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
