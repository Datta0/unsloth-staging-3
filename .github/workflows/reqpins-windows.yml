name: "reqpins windows"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: reqpins-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: "reqpins windows py${{ matrix.python }}"
    runs-on: windows-latest
    continue-on-error: false
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check requirement pins
        run: uv run --python ${{ matrix.python }} --no-project python tests/studio/install/check_requirement_pins.py ${{ matrix.python }}
