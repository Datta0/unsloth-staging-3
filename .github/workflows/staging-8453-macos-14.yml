name: "staging-8453 macos-14"
on:
  push:
    branches: ["pr-8453-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/hub/tests/test_model_services.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out0.txt 2>&1 || rc=$?; cat pytest_out0.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo)." pytest_out0.txt && ! grep -qE "^(FAILED|ERROR) " pytest_out0.txt; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" != "0" ]; then exit "$rc"; fi; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_export_absolute_paths.py studio/backend/tests/test_logging_middleware.py studio/backend/tests/test_training_pump_resilience.py studio/backend/tests/test_training_stop_watchdog.py studio/backend/tests/test_training_xet_fallback.py tests/studio/test_auth_form_input_count.py tests/studio/test_model_picker_contracts.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out1.txt 2>&1 || rc=$?; cat pytest_out1.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo)." pytest_out1.txt && ! grep -qE "^(FAILED|ERROR) " pytest_out1.txt; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" != "0" ]; then exit "$rc"; fi; exit "$rc"
