name: "baseline-main windows-latest"
on:
  push:
    branches: ["pr-7473-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/api_monitor.py'
      - 'studio/backend/picker/schemas.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/settings.py'
      - 'studio/backend/tests/test_api_monitor.py'
      - 'studio/backend/tests/test_openai_auto_switch.py'
      - 'studio/backend/utils/openai_auto_switch_settings.py'
      - 'studio/frontend/src/app/router.tsx'
      - 'studio/frontend/src/app/routes/__root.tsx'
      - 'studio/frontend/src/app/routes/api.tsx'
      - 'studio/frontend/src/features/api-monitor/api-monitor-overlay.tsx'
      - 'studio/frontend/src/features/api-monitor/api-monitor-page.tsx'
      - 'studio/frontend/src/features/api-monitor/components/saved-model-settings.tsx'
      - 'studio/frontend/src/features/api-monitor/index.ts'
      - 'studio/frontend/src/features/api-monitor/overlay-store.ts'
      - 'studio/frontend/src/features/api-monitor/use-api-monitor.ts'
      - 'studio/frontend/src/features/chat/api/chat-api.ts'
      - 'studio/frontend/src/features/chat/types/api.ts'
      - 'studio/frontend/src/features/hub/catalog/download-card.tsx'
      - 'studio/frontend/src/features/hub/catalog/hub-model-settings-view.tsx'
      - '.github/workflows/staging-7473-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_api_monitor.py studio/backend/tests/test_openai_auto_switch.py tests/studio/test_model_picker_contracts.py tests/studio/test_settings_compact_overflow_contract.py tests/studio/test_usage_examples_model_source_contract.py -q --tb=short || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
